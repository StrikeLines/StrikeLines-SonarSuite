[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "sidescantools"
version = "1.0.1"
description = "SonarSuite - fast, standalone sidescan sonar processing"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "StrikeLines" },
]
license = "GPL-3.0"
license-files = ["LICENSE"]
dependencies = [
  "geopy",
  "numpy>=2,<3",
  "pillow",
  "pyproj",
  "PyQt5>=5.15",
  "pyxtf>=1.4",
  "qtpy",
  "rasterio>=1.4,<2",
  "scikit-image>=0.25",
  "scipy",
  "utm",
]

[project.optional-dependencies]
napari = ["napari", "magicgui", "pyqtgraph", "pydantic>=2", "pyyaml"]
gmt = ["pygmt", "rioxarray"]

[project.urls]
Homepage = "https://strikelines.com/"
Repository = "https://github.com/StrikeLines/StrikeLines-SonarSuite"
Issues = "https://github.com/StrikeLines/StrikeLines-SonarSuite/issues"

[project.scripts]
sidescantools-contacts = "sidescantools.contact_picker_app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sidescantools = ["res/*.ico", "res/*.png"]
